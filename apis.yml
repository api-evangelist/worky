aid: worky
name: Worky
description: 'Worky is a Mexican HR and payroll SaaS platform for SMBs and mid-market
  companies that unifies operations, talent, and payroll in one system — from employee
  onboarding through CFDI 4.0 payroll stamping (timbrado) and salary dispersal — with
  direct IMSS, SUA, and INFONAVIT connectivity, digital time-clock and attendance,
  recruiting, performance reviews, people analytics, and an operational AI agent
  (SophIA). Backed by QED Investors. Worky publishes no public developer API; its
  backend at api.worky.mx is a private JWT-authenticated service.'
